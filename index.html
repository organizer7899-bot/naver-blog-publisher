<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>네이버 블로그 퍼블리셔</title>
<style>
body{margin:0;background:#f5f7f8;color:#18202a;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 4px 20px #0001}
h1{font-size:24px}.step{font-size:18px;font-weight:800;margin:0 0 12px}
input,textarea,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:15px;font-family:inherit}
textarea{min-height:220px;margin-top:8px}input{border:1px solid #ccd3dc}button{border:0;background:#03c75a;color:white;font-weight:800;margin-top:12px}
.hidden{display:none}.label{font-weight:800;margin-top:16px;display:block}.info{margin-top:10px;color:#667085}
</style>
</head>
<body>
<div class="wrap">
<h1>네이버 블로그 게시 준비</h1>
<div class="card">
<p class="step">① 동영상 선택</p>
<input id="video" type="file" accept="video/*">
<div id="fileInfo" class="info"></div>
</div>
<div id="content" class="card hidden">
<label class="label">② 제목</label>
<input id="title">
<label class="label">③ 본문</label>
<textarea id="body"></textarea>
<label class="label">④ 해시태그</label>
<input id="tags">
<button id="copy">⑤ 제목·본문·해시태그 복사</button>
<div id="status" class="info"></div>
</div>
</div>
<script>
const posts={
"1000021074.mp4":{
title:"세금계산서까지 발행했는데 거래처가 돈을 안 주나요?",
body:"세금계산서까지 발행했는데도 거래처에서 대금을 지급하지 않고 있다면 먼저 세금계산서만 확인할 것이 아니라 전체 거래 내용을 함께 확인해보세요.\n\n① 실제 거래 내용과 계약 조건 확인\n② 세금계산서 금액 확인\n③ 실제 입금된 금액 확인\n④ 남은 미수금 정확하게 계산\n⑤ 계약서·거래명세서·납품자료·입금내역 등 관련 자료 정리\n\n세금계산서 금액과 실제 입금내역을 비교하면 현재 미수금이 얼마인지 정확하게 확인하는 데 도움이 됩니다.\n\n미수금 회수를 준비한다면 세금계산서뿐 아니라 계약서와 거래명세서, 납품자료, 입금내역 등 전체 거래자료를 함께 정리해두세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담",
tags:"#미수금 #미수금회수 #거래처미수금 #세금계산서 #거래대금 #대금미지급 #채권추심 #채권관리 #사업자"
},
"1000021003.mp4":{
title:"거래처가 돈을 안 주고 있나요? 먼저 거래 자료부터 확인하세요",
body:"거래처가 대금을 지급하지 않고 있다면 먼저 감정적으로 대응하기보다 거래 사실과 미수금 내용을 정확하게 확인해보세요.\n\n① 계약서와 거래내역 확인\n② 정확한 미지급 금액 계산\n③ 지급 약속과 연락기록 보관\n④ 거래명세서·세금계산서·납품확인서 등 관련 자료 정리\n⑤ 실제 입금된 금액과 남은 미수금 확인\n\n특히 전체 거래금액과 실제 입금액을 비교해 현재 남아 있는 미수금을 정확하게 계산하는 것이 중요합니다.\n\n거래처가 계속 지급을 미루고 있다면 관련 자료를 한곳에 정리해 현재 채권 상황을 정확하게 파악해보세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담",
tags:"#미수금 #거래처미수금 #미수금회수 #채권추심 #채권관리 #거래대금 #대금미지급 #사업자"
},
"1000021090.mp4":{
title:"거래처가 돈을 안 주고 있다면, 연락 기록부터 꼭 보관하세요",
body:"거래처가 대금을 지급하지 않고 있다면 연락을 주고받은 기록부터 꼼꼼하게 보관해보세요.\n\n① 언제 지급을 요청했는지 기록\n② 거래처가 언제까지 지급하겠다고 했는지 확인\n③ 문자·카톡·이메일 등 연락기록 보관\n④ 실제 입금내역과 미수금 금액 확인\n⑤ 계약서·거래명세서 등 거래자료 함께 정리\n\n특히 상대방이 지급을 미루면서 특정 날짜에 주겠다고 약속했다면 그 내용도 남겨두는 것이 좋습니다.\n\n미수금 회수를 준비한다면 거래자료와 함께 연락기록도 정리해 현재 상황을 정확하게 파악해보세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담",
tags:"#미수금 #미수금회수 #거래처미수금 #연락기록 #채권추심 #채권관리 #거래대금 #대금미지급 #사업자"
}
}};
const $=id=>document.getElementById(id);
$("video").addEventListener("change",e=>{
 const f=e.target.files[0]; if(!f)return;
 $("fileInfo").textContent=f.name;
 const p=posts[f.name];
 if(p){
  $("title").value=p.title;$("body").value=p.body;$("tags").value=p.tags;
  $("content").classList.remove("hidden");
  $("status").textContent="이 영상에 맞는 게시 내용이 준비되었습니다.";
 }else{
  $("content").classList.remove("hidden");
  $("title").value="";$("body").value="";$("tags").value="";
  $("status").textContent="아직 이 영상에 대한 게시 내용이 등록되지 않았습니다.";
 }
});
$("copy").onclick=async()=>{
 const text=$("title").value+"\n\n"+$("body").value+"\n\n"+$("tags").value;
 await navigator.clipboard.writeText(text);
 $("status").textContent="제목·본문·해시태그를 복사했습니다.";
};
</script>
</body>
</html>
