"1000021069.mp4":{title:"용역은 끝났는데 돈을 못 받고 있나요?",body:"용역은 끝났는데 아직 대금을 받지 못했다면 먼저 계약서와 견적서부터 확인해보세요.\n\n① 계약서와 견적서에서 지급 조건 확인\n② 실제 용역 내용과 거래자료 확인\n③ 세금계산서와 입금내역 비교\n④ 실제 미지급 금액 정확하게 계산\n⑤ 계약서·견적서·작업보고서·세금계산서·입금내역 등 관련 자료 정리\n\n용역대금 미수금은 계약 조건과 실제 거래자료를 함께 확인하는 것이 중요합니다.\n\n자료를 날짜와 금액별로 정리해두면 현재 미지급 금액을 확인하고 상담을 준비하는 데 도움이 됩니다.\n\n못 받은 돈 때문에 혼자 고민하지 마세요. 필요한 자료부터 차근차근 확인해보세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담",tags:"#미수금 #미수금회수 #미수금상담 #채권관리 #채권추심 #용역대금 #대금미지급 #거래처미수금 #계약서 #견적서 #입금내역"},

"1000022950.mp4":{title:"거래처가 계속 미룬다면, 이제는 기다리기만 하지 마세요",body:"거래처에서 “이번 달에는 꼭 드릴게요”라는 말을 반복하고 있나요?\n\n처음에는 조금만 더 기다리면 해결될 거라고 생각할 수 있습니다. 하지만 한 달, 두 달 시간이 지나면서 같은 약속만 반복된다면 더 이상 기다리기만 하기보다 현재 상황을 확인해볼 필요가 있습니다.\n\n① 거래내역서와 미수금 금액을 정확하게 확인하세요.\n② 계약서·거래명세서·입금내역 등 관련 자료를 정리하세요.\n③ 문자·카톡·이메일 등 지급 약속과 요청 기록을 확인하세요.\n④ 계속 미루는 상황이라면 채권관리 방법을 상담받아보세요.\n\n미수금 문제는 대응 시점도 중요합니다. 관련 자료와 미지급 금액을 먼저 정리하고 현재 상황에 맞는 방법을 확인해보세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담",tags:"#미수금 #미수금회수 #거래처미수금 #대금미지급 #채권관리 #채권추심 #미수금상담 #거래처대금 #채권관리상담 #고려신용정보"},
"1000021044.mp4":{title:"거래처가 갑자기 연락을 피하고 있다면, 먼저 이것부터 확인하세요",body:"거래처가 갑자기 연락을 피하고 전화도 받지 않는다면 당황하기보다 지금까지의 거래 내용을 먼저 정리해보세요.\n\n① 거래계약과 거래내역을 확인하세요.\n② 실제 미수금 금액을 정확하게 계산하세요.\n③ 문자·카톡·이메일 등 지급 요청과 약속 내용을 보관하세요.\n④ 납품자료·거래명세서·세금계산서·입금내역 등 관련 자료를 정리하세요.\n\n특히 지급을 약속한 문자나 카톡, 이메일 등의 소통 기록은 거래 과정과 지급 약속을 확인하는 자료가 될 수 있습니다. 연락이 되지 않는다고 바로 포기하기보다 지금까지의 자료를 날짜와 금액별로 정리해 현재 상황을 정확하게 파악해보세요.\n\n미수금 문제는 상황에 맞는 대응 방법과 시점을 확인하는 것이 중요합니다.\n\n고려신용정보 | 채권관리·미수금 회수 상담\n상담전화 010-6294-5579",tags:"#거래처미수금 #미수금 #미수금회수 #대금미지급 #거래처연락두절 #채권관리 #채권추심 #미수금상담 #거래대금 #고려신용정보"},
"1000021063.mp4":{title:"거래처가 갑자기 폐업했다면? 미수금부터 확인하세요",body:"거래처가 갑자기 폐업했다는 사실을 알게 되었다면 당황하기보다 현재 미수금과 거래자료부터 정확하게 확인해보세요.\n\n폐업했다고 해서 미수금을 바로 포기할 필요는 없습니다. 먼저 다음 내용을 확인하세요.\n\n① 전체 거래금액과 지금까지 받은 금액을 확인하세요.\n② 남아 있는 미수금 금액을 정확하게 계산하세요.\n③ 계약서·세금계산서·거래명세서·입금내역 등 증빙자료를 정리하세요.\n④ 거래 과정에서 주고받은 문자·카톡·이메일 등 관련 기록도 확인하세요.\n⑤ 현재 채권 상황에 맞는 대응 방법을 확인하세요.\n\n정확한 거래금액과 미수금 금액을 먼저 파악하고 관련 자료를 체계적으로 정리하는 것이 중요합니다.\n\n거래처 폐업으로 미수금 때문에 고민하고 있다면 혼자 포기하기보다 현재 채권 상황을 먼저 정확하게 확인해보세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담\n상담전화 010-6294-5579",tags:"#거래처폐업 #폐업미수금 #미수금 #미수금회수 #거래처미수금 #대금미지급 #채권관리 #채권추심 #미수금상담 #고려신용정보"},
"1000021027.mp4":{title:"물건은 납품했는데 거래처가 돈을 안 준다면, 먼저 이것부터 확인하세요",body:"물건은 납품했는데 거래처에서 대금을 지급하지 않고 있다면 먼저 거래 내용을 확인할 수 있는 자료부터 정리해보세요.\n\n① 발주서와 거래명세서 확인\n② 실제 납품한 물품과 수량 확인\n③ 세금계산서와 거래금액 확인\n④ 실제 입금된 금액 확인\n⑤ 문자·카톡·이메일 등 지급 요청 및 약속 기록 정리\n\n특히 발주서와 거래명세서는 어떤 물품을 얼마에 거래했는지 확인하는 데 도움이 될 수 있습니다.\n\n납품한 내용과 계약·거래자료, 입금내역을 함께 확인해 정확한 미지급 금액을 계산해보세요.\n\n관련 자료를 날짜와 금액별로 정리해두면 미수금 회수를 준비하는 데 도움이 됩니다.\n\n고려신용정보 | 채권관리·미수금 회수 상담",tags:"#물품대금 #물품대금미수금 #미수금 #미수금회수 #거래처미수금 #대금미지급 #채권관리 #채권추심 #발주서 #거래명세서"},
"1000021023.mp4":{title:"공사대금을 못 받았다면, 이 자료부터 확인하세요",body:"공사는 끝났는데 공사대금을 받지 못하고 있다면 관련 자료부터 정확하게 정리해보세요.\n\n① 계약서와 견적서\n② 공사사진과 작업내역\n③ 거래명세서 및 세금계산서\n④ 실제 입금내역\n⑤ 문자·카톡·이메일 등 지급 약속 및 요청 기록\n\n특히 공사 과정에서 작성된 작업내역과 공사사진은 실제 공사가 진행됐다는 사실을 확인하는 데 도움이 될 수 있습니다.\n\n계약 내용과 실제 공사내역, 입금된 금액을 함께 확인해 정확한 미지급 금액을 계산하는 것이 중요합니다.\n\n관련 자료를 날짜와 금액별로 정리해두고 미수금 회수를 준비해보세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담",tags:"#공사대금 #공사대금미수금 #미수금 #미수금회수 #공사비 #대금미지급 #채권관리 #채권추심 #공사사진 #작업내역"},
"1000021104.mp4":{title:"거래처가 계속 미룬다면, 이제는 기다리기만 하지 마세요",body:"거래처에서 계속 “이번 달에는 꼭 드릴게요”라는 말을 반복하고 있나요?\n\n처음에는 조금만 더 기다리면 해결할 것이라고 생각할 수 있습니다. 하지만 한 달, 두 달 시간이 지나면서 같은 약속만 반복된다면 상황을 다시 확인해볼 필요가 있습니다.\n\n① 거래내역과 미수금 금액을 정확하게 확인하세요.\n② 계약서·거래명세서·입금내역 등 관련 자료를 정리하세요.\n③ 문자·카톡·이메일 등 지급 약속과 요청 기록도 함께 확인하세요.\n④ 계속 기다리기보다 현재 상황에 맞는 채권관리 방법을 상담받아보세요.\n\n미수금 문제는 언제 대응하느냐도 중요합니다. 혼자 고민하기보다 현재 거래자료와 미지급 금액을 먼저 정리해 상황에 맞는 방법을 확인해보세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담\n상담전화 010-6294-5579",tags:"#미수금 #미수금회수 #거래처미수금 #대금미지급 #채권관리 #채권추심 #채권관리상담 #거래처대금 #미수금상담 #고려신용정보"},
"1000021091.mp4":{title:"거래처가 돈을 안 준다고 무작정 감정적으로 대응하지 마세요",body:"거래처가 돈을 주지 않는다고 무작정 감정적으로 대응하지 마세요.\n\n미수금이 발생했다면 먼저 차분하게 현재 상황과 거래자료를 확인하는 것이 중요합니다.\n\n① 욕설이나 협박성 연락은 피하세요.\n감정적으로 대응하기보다 차분하게 지급을 요청하세요.\n\n② 같은 내용의 연락을 계속 반복하지 마세요.\n지급 요청 내용과 연락 기록을 정리해두세요.\n\n③ 계약서와 거래자료를 먼저 확인하세요.\n계약 내용과 실제 거래 내용을 확인한 뒤 대응하는 것이 좋습니다.\n\n④ 금액과 거래내용, 지급기일 등 증빙자료를 정리하세요.\n현재 미수금이 얼마인지 정확하게 확인해보세요.\n\n미수금 문제는 감정적으로 대응하기보다 계약서와 거래자료, 지급기일, 증빙자료를 먼저 확인하고 차분하게 대응하는 것이 중요합니다.\n\n못 받은 돈 때문에 혼자 고민하지 마세요. 현재 상황을 정확하게 정리하고 필요한 대응 방법을 확인해보세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담\n상담전화 010-6294-5579",tags:"#미수금 #미수금회수 #거래처미수금 #대금미지급 #채권관리 #채권추심 #미수금상담 #채권관리상담 #거래처대금 #고려신용정보"},
"1000021090.mp4":{title:"거래처가 돈을 안 주고 있다면, 연락 기록도 꼭 보관하세요",body:"거래처가 돈을 안 주고 있다면 지금까지의 연락 기록도 꼭 보관하세요.\n\n① 언제 지급을 요청했는지 기록하세요.\n지급을 요청한 날짜와 내용을 정리해두세요.\n\n② 상대방이 언제까지 지급하겠다고 했는지 남겨두세요.\n지급 약속을 받은 날짜와 내용을 함께 기록하세요.\n\n③ 문자·카톡·이메일 등 관련 대화는 삭제하지 마세요.\n거래 과정과 지급 약속을 확인할 수 있도록 그대로 보관하세요.\n\n④ 날짜순으로 정리하세요.\n요청일·지급 약속일·입금일 등을 날짜순으로 정리하면 현재 채권 상황을 파악하는 데 도움이 됩니다.\n\n미수금이 발생했다면 연락 기록과 거래자료를 함께 정리해 현재 상황을 정확하게 확인해보세요.\n\n못 받은 돈, 혼자 고민하지 마세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담\n상담전화 010-6294-5579",tags:"#미수금 #미수금회수 #거래처미수금 #대금미지급 #연락기록 #지급요청 #지급약속 #채권관리 #채권추심 #고려신용정보"},
"1000021089.mp4":{title:"거래처 미수금, 먼저 얼마가 남았는지 정확하게 확인하세요",body:"거래처가 돈을 덜 줬다면 먼저 얼마가 남았는지 정확하게 확인해보세요.\n\n① 전체 거래금액을 확인하세요.\n거래한 전체 금액을 먼저 확인합니다.\n\n② 지금까지 실제로 받은 금액을 모두 합산하세요.\n입금내역을 확인해 실제 받은 금액을 정확하게 계산합니다.\n\n③ 전체 거래금액에서 받은 금액을 빼보세요.\n전체 금액에서 실제 받은 금액을 제외하면 남은 미지급 금액을 확인할 수 있습니다.\n\n④ 거래일자별로 정리하세요.\n거래가 여러 번 있었다면 거래일자별로 정리해 정확한 금액을 확인하세요.\n\n미수금 회수의 시작은 정확한 금액을 확인하는 것입니다. 거래자료와 입금내역을 함께 정리해 현재 남아 있는 미지급 금액을 확인해보세요.\n\n못 받은 돈, 혼자 고민하지 마세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담\n상담전화 010-6294-5579",tags:"#미수금 #미수금회수 #거래처미수금 #대금미지급 #미지급금액 #거래금액 #입금내역 #채권관리 #채권추심 #고려신용정보"},
"1000021086.mp4":{title:"미수금 상담을 받으려면 어떤 자료가 필요할까요?",body:"미수금 상담을 받으려면 어떤 자료를 준비해야 할까요? 상담 전에 아래 다섯 가지를 먼저 정리해보세요.\n\n① 거래처로부터 받아야 할 금액이 얼마인지 정확히 정리하세요.\n전체 거래금액과 지금까지 받은 금액을 확인해 남은 미수금을 정확하게 계산하세요.\n\n② 거래한 날짜와 내용을 정리하세요.\n어떤 내용으로 거래했는지 구체적으로 정리해두세요.\n\n③ 언제 지급하기로 약속했는지 정확한 날짜를 확인하세요.\n지급하기로 한 날짜와 관련 약속 내용을 정리하세요.\n\n④ 지금까지 실제로 받은 금액을 정확히 정리하세요.\n입금내역을 확인해 실제 받은 금액을 빠짐없이 정리하세요.\n\n⑤ 계약서와 거래내역 같은 증빙자료를 준비하세요.\n계약서, 거래명세서, 세금계산서, 입금내역, 문자·카톡 등 관련 자료를 모두 준비하세요.\n\n미수금 상담 전에는 이 다섯 가지부터 정리해두면 현재 거래 내용과 미지급 금액을 정확하게 확인하는 데 도움이 됩니다.\n\n고려신용정보 | 채권관리·미수금 회수 상담\n상담전화 010-6294-5579",tags:"#미수금 #미수금상담 #미수금회수 #거래처미수금 #대금미지급 #거래내역 #입금내역 #계약서 #증빙자료 #채권관리 #채권추심 #고려신용정보"},
"1000021081.mp4":{title:"미수금이 생겼는데 언제 상담을 받아야 할까요?",body:"미수금이 생겼는데 언제 상담을 받아야 할까요? 먼저 현재 상황을 정확하게 확인해보세요.\n\n① 지급기일이 지났는지 확인하세요.\n약속한 지급기일이 지났다면 현재 상황을 점검할 필요가 있습니다.\n\n② 지급이 계속 미뤄지고 있는지 확인하세요.\n같은 약속을 반복하면서 지급이 계속 지연된다면 거래자료와 미수금 상황을 정리해보세요.\n\n③ 연락이 어려워지고 있는지 확인하세요.\n전화나 문자·카톡 등에 대한 답변이 줄어들거나 연락이 어려워진다면 관련 기록을 보관하세요.\n\n④ 증빙자료를 모아보세요.\n계약서·거래명세서·세금계산서·입금내역·문자·카톡 등 거래와 지급 약속을 확인할 수 있는 자료를 정리하세요.\n\n⑤ 현재 미수금 금액을 정확하게 확인하세요.\n전체 거래금액과 실제 입금액을 비교해 남은 금액을 확인하세요.\n\n미수금 문제는 기다리기만 하기보다 현재 상황을 정확하게 파악하는 것부터 시작합니다. 관련 자료를 정리해 현재 채권 상황에 맞는 대응 방법을 확인해보세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담\n상담전화 010-6294-5579",tags:"#미수금 #미수금상담 #미수금회수 #거래처미수금 #대금미지급 #지급기일 #증빙자료 #입금내역 #채권관리 #채권추심 #고려신용정보"},
"1000021080.mp4":{title:"거래처가 계속 조금만 기다려 달라고 한다면, 언제까지 기다려야 할까요?",body:"거래처에서 “조금만 기다려 달라”, “곧 입금하겠다”는 말을 반복하고 있나요?\n\n처음에는 며칠만 기다리면 해결될 것 같지만, 같은 약속이 계속 반복된다면 현재 상황을 정확하게 확인해보는 것이 중요합니다.\n\n① 실제 미수금 금액을 정확하게 확인하세요.\n전체 거래금액과 지금까지 받은 금액을 비교해 남은 금액을 계산하세요.\n\n② 계약서·거래명세서·세금계산서·입금내역을 정리하세요.\n거래와 미지급 금액을 확인할 수 있는 자료를 한곳에 모아두세요.\n\n③ 문자·카톡·이메일 등 지급 약속 기록도 보관하세요.\n언제 지급하겠다고 했는지 날짜와 내용을 함께 정리해두세요.\n\n④ 계속 기다리기보다 현재 채권 상황을 확인하세요.\n지급이 반복해서 미뤄지고 있다면 관련 자료를 정리한 뒤 상황에 맞는 채권관리 방법을 확인해보세요.\n\n미수금 문제는 막연히 기다리기보다 거래자료와 입금내역, 지급 약속 기록을 먼저 정리하는 것부터 시작해보세요.\n\n고려신용정보 | 채권관리·미수금 회수 상담\n상담전화 010-6294-5579",tags:"#미수금 #미수금회수 #거래처미수금 #대금미지급 #지급약속 #거래처대금 #채권관리 #채권추심 #미수금상담 #고려신용정보"},
"1000021078.mp4":{title:"외상거래 미수금 돈 받기 전에 반드시 확인해야 할 4가지",body:"외상으로 거래했는데 약속한 날에 돈이 들어오지 않았어요.\n\n거래처 미수금이 발생했다면 단순히 기다리기보다 먼저 채권의 현재 상태부터 정확하게 확인해야 합니다.\n\n첫째 거래일과 전체 거래금액을 확인하세요.\n언제 거래했고 총 얼마를 받아야 하는지 정확하게 정리합니다.\n\n둘째 실제 입금된 금액을 확인하세요.\n부분적으로 입금된 금액이 있다면 전체 거래금액에서 실제 입금액을 빼고 현재 남아 있는 미수금을 정확하게 계산해야 합니다.\n\n셋째 관련 증빙자료를 한곳에 모으세요.\n계약서 거래명세서 세금계산서 입금내역뿐만 아니라 문자 카카오톡 등 지급을 약속한 기록도 함께 정리해 두세요.\n\n넷째 말이 아니라 자료를 기준으로 판단하세요.\n다음 달에 주겠다는 약속이 반복되고 있다면 약속만 계속 기다리기보다 현재 채권과 거래자료를 객관적으로 확인하고 어떤 회수 방법을 검토할 수 있는지 상담해 보는 것이 중요합니다.\n\n특히 미수금이 장기간 방치되면 나중에 사실관계를 확인하거나 증빙을 정리하는 데 어려움이 생길 수 있습니다.\n\n지금 가지고 있는 자료부터 정리해 보세요.\n거래내역과 입금내역만 정확하게 정리해도 현재 상황을 파악하는 데 큰 도움이 됩니다.\n\n미수금 상거래대금 등 못 받은 돈으로 고민하고 있다면 현재 자료를 가지고 전문가와 상담해 보세요.\n\n고려신용정보 상담문의\n010 6294 5579",tags:"#미수금 #미수금회수 #못받은돈 #외상거래 #상거래미수금 #거래처미수금 #채권추심 #채권관리 #고려신용정보 #거래내역 #입금내역 #미수금내역 #계약서 #거래명세서 #세금계산서 #지급약속 #미수채권 #대금미지급 #공사대금 #물품대금 #용역대금 #사업자고민 #자영업자 #채권관리상담"},
"1000021077.mp4":{title:"미수금 회수 전에 반드시 확인해야 할 결정적 TIP",body:"미수금이 발생했다면 상대방의 말보다 정확한 금액과 증빙자료를 먼저 확인하는 것이 중요합니다.\n\n전체 거래금액에서 실제 입금된 금액을 빼서 현재 미수금이 얼마인지 정확하게 계산하세요.\n\n그리고 계약서 거래명세서 세금계산서 납품자료 입금내역 지급 약속 기록을 날짜순으로 정리해 두세요.\n\n특히 지급기일과 실제 입금내역을 함께 정리하면 상대방이 얼마를 지급하기로 했는지 현재 얼마가 남아 있는지 한눈에 확인할 수 있습니다.\n\n미수금 회수에서 가장 중요한 것은 상대방의 약속만 기다리는 것이 아니라 현재 채권의 금액과 증빙자료를 정확하게 정리하는 것입니다.\n\n고려신용정보 상담문의\n010 6294 5579\n\nTIP\n\n미수금이 생기면 가장 먼저 전체 거래금액과 실제 입금액을 비교해 정확한 잔액부터 확정하세요.\n\n그다음 지급기일과 지급 약속 기록을 날짜순으로 정리해 두세요.\n\n금액과 날짜가 정확하게 정리되어 있어야 현재 채권 상황을 제대로 파악하고 다음 대응을 준비할 수 있습니다.",tags:"미수금 미수금회수 못받은돈 외상거래 거래처미수금 상거래미수금 채권추심 채권관리 고려신용정보 거래내역 입금내역 계약서 거래명세서 세금계산서 대금미지급 미수채권 사업자고민 자영업자 채권관리상담"},

const $=id=>document.getElementById(id);
$("video").addEventListener("change",e=>{
 const f=e.target.files[0]; if(!f)return;
 $("fileInfo").textContent=f.name;
 const p=posts[f.name];
 if(p){
  $("title").value=p.title;$("body").value=p.body;$("tags").value=p.tags;
  $("content").classList.remove("hidden");
  $("status").textContent="이 영상에 맞는 게시 내용이 준비되었습니다.";
 }else{
  $("content").classList.remove("hidden");
  $("title").value="";$("body").value="";$("tags").value="";
  $("status").textContent="아직 이 영상에 대한 게시 내용이 등록되지 않았습니다.";
 }
});
async function copyText(text){
 text=String(text||"");
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;}
 }catch(e){}
 try{
  const ta=document.createElement("textarea");
  ta.value=text;ta.setAttribute("readonly","");
  ta.style.position="fixed";ta.style.left="-9999px";
  document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
  const ok=document.execCommand("copy");ta.remove();if(ok)return true;
 }catch(e){}
 return false;
}
async function doCopy(btn,text,label){
 const ok=await copyText(text);
 btn.classList.add("copied");
 const old=btn.textContent;
 btn.textContent=ok?label+" ✓":"복사 실패";
 setTimeout(()=>{btn.classList.remove("copied");btn.textContent=old;},1200);
 if(ok)$("status").textContent=label+" 복사 완료";
 else $("status").textContent="복사에 실패했습니다.";
 return ok;
}
$("copy").onclick=e=>doCopy(e.currentTarget,$("body").value+"\n\n"+$("tags").value,"본문과 해시태그");
$("copyTitle").onclick=e=>doCopy(e.currentTarget,$("title").value,"제목");
$("copyBody").onclick=e=>doCopy(e.currentTarget,$("body").value,"본문");
$("copyTags").onclick=e=>doCopy(e.currentTarget,$("tags").value,"해시태그");
async function shareNaver(btn){
 const old=btn.textContent;
 btn.classList.add("copied");
 btn.textContent="네이버 공유하기 ✓";
 const naverWindow=window.open("https://blog.naver.com/PostWriteForm.naver?blogId=thkim5579","_blank");
 const text=$("title").value+"\n\n"+$("body").value+"\n\n"+$("tags").value;
 const copied=await copyText(text);
 $("status").textContent=naverWindow
  ? (copied?"네이버 글쓰기 창을 열었습니다. 내용도 복사했습니다.":"네이버 글쓰기 창을 열었습니다.")
  : "네이버 글쓰기 창이 차단되었습니다. 팝업을 허용해주세요.";
 setTimeout(()=>{btn.classList.remove("copied");btn.textContent=old;},1200);
}
$("post").onclick=e=>shareNaver(e.currentTarget);
</script>
